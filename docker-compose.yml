services:
  mysql:
    image: mysql:8.0
    container_name: mdm-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_PASSWORD:-password}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-mdm}
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    ports:
      # 宿主映射端口可配（.env 中 MYSQL_PORT，默认 3306）；容器内固定 3306
      - "${MYSQL_PORT:-3306}:3306"
    volumes:
      - mysql-data:/var/lib/mysql
      # 首次启动自动执行初始化脚本（按文件名顺序）
      - ./mdm-backend/sql/ry_20260417.sql:/docker-entrypoint-initdb.d/01-ry.sql:ro
      - ./mdm-backend/sql/quartz.sql:/docker-entrypoint-initdb.d/02-quartz.sql:ro
      - ./mdm-backend/sql/mdm/init.sql:/docker-entrypoint-initdb.d/03-mdm.sql:ro
    healthcheck:
      # 引用容器内环境变量（$$ 由容器展开，避免明文密码；随 MYSQL_ROOT_PASSWORD 变化）
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -uroot -p\"$$MYSQL_ROOT_PASSWORD\" --silent"]
      interval: 5s
      timeout: 5s
      retries: 20

  redis:
    image: redis:7-alpine
    container_name: mdm-redis
    restart: unless-stopped
    # 默认无密码；.env 配置 REDIS_PASSWORD 后自动启用密码（与 backend 同源，保持一致）
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD:-}"]
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:-}
    ports:
      # 宿主映射端口可配（.env 中 REDIS_PORT，默认 6379）；容器内固定 6379
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$$REDIS_PASSWORD\" --no-auth-warning ping | grep PONG"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build: ./mdm-backend
    container_name: mdm-backend
    # 失败自动重试（如首次启动时 MySQL 尚未就绪），MySQL 就绪后自动恢复
    restart: unless-stopped
    environment:
      # 主机名/端口/用户名固定（容器内网恒定值，不读 .env）
      MYSQL_HOST: mysql
      MYSQL_PORT: 3306
      MYSQL_USERNAME: root
      REDIS_HOST: redis
      REDIS_PORT: 6379
      # 容器内端口固定 8080（与前端 nginx 反代一致，不随环境变量变化）
      SERVER_PORT: "8080"
      # 仅密码从项目根 .env 读取（compose 自动加载，缺失时用默认值兜底）
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-password}
      REDIS_PASSWORD: ${REDIS_PASSWORD:-}
    ports:
      # 宿主映射端口可配（.env 中 SERVER_PORT，默认 8080）；容器内固定 8080
      - "${SERVER_PORT:-8080}:8080"
    volumes:
      - ./logs:/app/logs
      - ./uploadPath:/app/uploadPath
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy

  frontend:
    build: ./mdm-frontend
    container_name: mdm-frontend
    restart: unless-stopped
    ports:
      # 宿主映射端口可配（.env 中 FRONTEND_PORT，默认 80）；容器内固定 80
      - "${FRONTEND_PORT:-80}:80"
    depends_on:
      - backend

volumes:
  mysql-data:
  redis-data:
