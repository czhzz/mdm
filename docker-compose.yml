services:
  mysql:
    image: mysql:8.0
    container_name: mdm-mysql
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_PASSWORD:-password}
      MYSQL_DATABASE: mdm
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    ports:
      - "3306:3306"
    volumes:
      - mysql-data:/var/lib/mysql
      # 首次启动自动执行初始化脚本（按文件名顺序）
      - ./mdm-backend/sql/ry_20260417.sql:/docker-entrypoint-initdb.d/01-ry.sql:ro
      - ./mdm-backend/sql/quartz.sql:/docker-entrypoint-initdb.d/02-quartz.sql:ro
      - ./mdm-backend/sql/mdm/init.sql:/docker-entrypoint-initdb.d/03-mdm.sql:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-ppassword"]
      interval: 5s
      timeout: 5s
      retries: 20

  redis:
    image: redis:7-alpine
    container_name: mdm-redis
    # 默认无密码；.env 配置 REDIS_PASSWORD 后自动启用密码（与 backend 同源，保持一致）
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD:-}"]
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:-}
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$$REDIS_PASSWORD\" --no-auth-warning ping | grep PONG"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build: ./mdm-backend
    container_name: mdm-backend
    environment:
      # 主机名/端口/用户名固定（容器内网恒定值，不读 .env）
      MYSQL_HOST: mysql
      MYSQL_PORT: 3306
      MYSQL_USERNAME: root
      REDIS_HOST: redis
      REDIS_PORT: 6379
      # 仅密码从项目根 .env 读取（compose 自动加载，缺失时用默认值兜底）
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-password}
      REDIS_PASSWORD: ${REDIS_PASSWORD:-}
    ports:
      - "8080:8080"
    volumes:
      - ./logs:/app/logs
      - ./uploadPath:/app/uploadPath
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy

  frontend:
    build: ./mdm-frontend
    container_name: mdm-frontend
    ports:
      - "80:80"
    depends_on:
      - backend

volumes:
  mysql-data:
  redis-data:
